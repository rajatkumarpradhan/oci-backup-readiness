name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke (healthy config has no findings)
        run: bk-check examples/good.json --as-of 2026-10-15T00:00:00 --fail-on low
      - name: CLI smoke (risky config is flagged)
        run: bk-check examples/risky.json --as-of 2026-10-15T00:00:00 --output report.json --fail-on high || test $? -eq 2
      - name: CLI smoke (SARIF output)
        run: bk-check examples/risky.json --as-of 2026-10-15T00:00:00 --output report.sarif --format sarif
